<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | RecoVolt</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#111318",
                        "on-surface": "#e2e2e9",
                        "on-surface-variant": "#8f9bb3",
                        "primary": "#548dff",
                        "primary-container": "#2d4a8e",
                        "surface-container": "#1d2024",
                        "surface-container-highest": "#353740",
                        "error": "#f87171",
                    }
                }
            }
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #111318; }
        .glow-404 {
            text-shadow: 0 0 40px rgba(84,141,255,0.4), 0 0 80px rgba(84,141,255,0.2);
        }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .float-anim { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Ambient Glow -->
    <div class="absolute top-1/4 left-1/3 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[128px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-error/5 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="text-center px-6 relative z-10">
        <div class="float-anim mb-8">
            <div class="w-24 h-24 rounded-3xl bg-surface-container border border-white/10 flex items-center justify-center mx-auto shadow-[0_0_30px_rgba(84,141,255,0.15)]">
                <span class="material-symbols-outlined text-primary text-5xl">power_off</span>
            </div>
        </div>
        
        <h1 class="text-[8rem] sm:text-[10rem] font-black text-primary leading-none glow-404 tracking-tighter">404</h1>
        <h3 class="text-2xl sm:text-3xl font-bold text-on-surface mt-2 mb-4">Page Not Found</h3>
        <p class="text-on-surface-variant max-w-md mx-auto mb-10 text-sm sm:text-base leading-relaxed">
            Looks like this connection is broken. The page you're looking for doesn't exist or has been moved.
        </p>
        
        <a href="/" class="inline-flex items-center gap-2 px-8 py-3.5 bg-primary-container text-white rounded-xl text-sm font-bold hover:bg-primary transition-all shadow-[0_0_20px_rgba(84,141,255,0.25)] hover:shadow-[0_0_30px_rgba(84,141,255,0.4)]">
            <span class="material-symbols-outlined text-[20px]">home</span>
            Back to Home
        </a>
    </div>

</body>
</html>
