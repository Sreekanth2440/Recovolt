{% extends 'base.html' %}

{% block title %}Register - RecoVolt{% endblock %}

{% block content_public %}
<section class="min-h-screen flex items-center justify-center pt-24 pb-12 px-gutter relative overflow-hidden">
    <!-- Background Glow Effect -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-tertiary/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="glass-card w-full max-w-lg p-8 md:p-10 rounded-3xl relative z-10 reveal active">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-tertiary-container/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-tertiary-container/30">
                <span class="material-symbols-outlined text-tertiary text-3xl" style="font-variation-settings: 'FILL' 1;">person_add</span>
            </div>
            <h2 class="font-display text-headline-lg text-on-surface mb-2">Create Account</h2>
            <p class="font-body-sm text-on-surface-variant">Register to start managing your complaints</p>
        </div>

        <form method="POST" id="registerForm" class="space-y-5" autocomplete="off">
            <div class="space-y-2">
                <label class="block font-label-caps text-on-surface-variant">Full Name</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant text-xl">person</span>
                    <input type="text" name="name" placeholder="Enter your full name" required
                           class="w-full bg-surface-container-highest border border-white/10 rounded-xl py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-tertiary/50 focus:ring-1 focus:ring-tertiary/50 transition-all font-body-md">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block font-label-caps text-on-surface-variant">Email Address</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant text-xl">mail</span>
                    <input type="email" name="email" placeholder="Enter your email" required autocomplete="new-password"
                           class="w-full bg-surface-container-highest border border-white/10 rounded-xl py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-tertiary/50 focus:ring-1 focus:ring-tertiary/50 transition-all font-body-md">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="space-y-2">
                    <label class="block font-label-caps text-on-surface-variant">Phone Number</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant text-xl">call</span>
                        <input type="text" name="phone" placeholder="10-digit number" required
                               class="w-full bg-surface-container-highest border border-white/10 rounded-xl py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-tertiary/50 focus:ring-1 focus:ring-tertiary/50 transition-all font-body-md">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block font-label-caps text-on-surface-variant">Consumer No.</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant text-xl">tag</span>
                        <input type="text" name="consumer_number" placeholder="KSEB Number" required
                               class="w-full bg-surface-container-highest border border-white/10 rounded-xl py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-tertiary/50 focus:ring-1 focus:ring-tertiary/50 transition-all font-body-md">
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block font-label-caps text-on-surface-variant">Password</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant text-xl">lock</span>
                    <input type="password" name="password" placeholder="Min 6 characters" required autocomplete="new-password"
                           class="w-full bg-surface-container-highest border border-white/10 rounded-xl py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-tertiary/50 focus:ring-1 focus:ring-tertiary/50 transition-all font-body-md">
                </div>
            </div>

            <button type="submit" class="relative overflow-hidden bg-gradient-to-r from-tertiary-container to-blue-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 group text-base shadow-[0_8px_30px_rgb(0,0,0,0.12)] hover:shadow-[0_8px_30px_rgba(0,155,209,0.4)] transition-all hover:-translate-y-1 w-full   py-4 rounded-xl font-bold flex items-center justify-center gap-2 group mt-6" style="box-shadow: 0 0 20px rgba(0, 155, 209, 0.3);">
                Create Account
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">how_to_reg</span>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/10 pt-6">
            <p class="font-body-sm text-on-surface-variant">
                Already have an account? 
                <a href="{{ url_for('auth.login') }}" class="text-tertiary hover:text-tertiary-container font-semibold transition-colors ml-1">Login here</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
